name: Publicar Three.js con Vite en GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: github-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Descargar código del repositorio
        uses: actions/checkout@v4
      - name: Configurar Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Instalar dependencias
        run: npm ci
      - name: Compilar sitio con Vite
        run: npm run build
      - name: Configurar GitHub Pages
        uses: actions/configure-pages@v5
      - name: Subir archivos generados en dist
        uses: actions/upload-pages-artifact@v4
        with:
          path: ./dist
      - name: Publicar sitio
        id: deployment
        uses: actions/deploy-pages@v4
